name: Qiyuan Mod Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Gradle project
        shell: bash
        run: |
          echo "当前目录："
          pwd
          echo "仓库文件："
          ls -la
          echo "查找构建文件："
          find . -maxdepth 4 \( -name build.gradle -o -name build.gradle.kts \)

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Forge Mod
        shell: bash
        run: |
          BUILD_FILE="$(find . -maxdepth 4 -name build.gradle -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "::error::未找到 build.gradle，请检查仓库目录结构。"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          cd "$PROJECT_DIR"
          gradle --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Qiyuan-Forge-1.20.1
          path: "**/build/libs/*.jar"
          if-no-files-found: error
          retention-days: 14
