name: Qiyuan Mod Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Debug repository structure
        shell: bash
        run: |
          echo "===== PWD ====="
          pwd
          echo ""
          echo "===== Top-level listing ====="
          ls -la
          echo ""
          echo "===== Full tree (depth 5, excluding .git) ====="
          find . -maxdepth 5 -not -path '*/.git/*' | sort
          echo ""
          echo "===== Search build.gradle / settings.gradle ====="
          find . -maxdepth 6 \( -name build.gradle -o -name build.gradle.kts -o -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.git/*'
          echo ""
          echo "===== Any .zip / .rar / .7z in repo? ====="
          find . -maxdepth 6 \( -name '*.zip' -o -name '*.rar' -o -name '*.7z' \) -not -path '*/.git/*'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Forge Mod
        shell: bash
        run: |
          BUILD_FILE="$(find . -maxdepth 6 -name build.gradle -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "::error::未找到 build.gradle，请检查仓库目录结构。"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "使用构建目录：$PROJECT_DIR"
          cd "$PROJECT_DIR"
          if [ -x ./gradlew ]; then
            echo "使用 gradlew"
            ./gradlew --no-daemon build
          else
            echo "使用系统 gradle"
            gradle --no-daemon build
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Qiyuan-Forge-1.20.1
          path: "**/build/libs/*.jar"
          if-no-files-found: error
          retention-days: 14
