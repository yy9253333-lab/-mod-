name: Auto Build JAR

on:
  workflow_dispatch:
  push:
    paths:
      - 'uploads/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: auto-build-jar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare workspace
        id: prepare
        shell: bash
        run: |
          mkdir -p output source

          FILE=$(find uploads -type f 2>/dev/null | sort | tail -n 1)

          if [ -z "$FILE" ]; then
            echo "recognized=false" >> "$GITHUB_OUTPUT"
            echo "version=无法识别" >> "$GITHUB_OUTPUT"
            echo "没有找到 uploads/ 中的文件。"
            exit 0
          fi

          echo "上传文件：$FILE"

          case "$FILE" in
            *.zip|*.ZIP)
              if ! unzip -t "$FILE" >/dev/null 2>&1; then
                echo "recognized=false" >> "$GITHUB_OUTPUT"
                echo "version=无法识别" >> "$GITHUB_OUTPUT"
                echo "ZIP 文件无法正常读取。"
                exit 0
              fi

              unzip -q "$FILE" -d source
              ;;
            *)
              echo "该文件不是 ZIP，无法自动解压并识别完整项目。"
              echo "recognized=false" >> "$GITHUB_OUTPUT"
              echo "version=无法识别" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          BUILD_FILE=$(find source -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "recognized=false" >> "$GITHUB_OUTPUT"
            echo "version=无法识别" >> "$GITHUB_OUTPUT"
            echo "没有找到 Gradle 构建文件。"
            exit 0
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          if ! grep -R -q -E \
            'net\.minecraftforge|minecraftforge' \
            "$PROJECT_DIR" \
            --include='build.gradle' \
            --include='build.gradle.kts' \
            --include='gradle.properties'; then
            echo "recognized=false" >> "$GITHUB_OUTPUT"
            echo "version=无法识别" >> "$GITHUB_OUTPUT"
            echo "没有识别到 Forge 项目标记。"
            exit 0
          fi

          echo "recognized=true" >> "$GITHUB_OUTPUT"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Determine version
        if: steps.prepare.outputs.recognized == 'true'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh api "repos/$REPO/actions/runs?per_page=100" \
            --jq '[.workflow_runs[] |
              select(.name == "Auto Build JAR") |
              .run_number] | max // 0' > previous.txt

          N=$(cat previous.txt)
          NEXT=$((N + 1))

          if [ "$NEXT" -eq 1 ]; then
            VERSION="R1"
          else
            VERSION="R1.$((NEXT - 1))"
          fi

          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.prepare.outputs.recognized == 'true'
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon build
          else
            gradle --no-daemon build
          fi

      - name: Collect JAR
        if: steps.prepare.outputs.recognized == 'true'
        env:
          VERSION: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          mkdir -p output

          find source -type f -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp {} output/ \;

          JAR=$(find output -maxdepth 1 -name '*.jar' -print -quit)

          if [ -z "$JAR" ]; then
            echo "编译没有生成 JAR。"
            exit 1
          fi

          mv "$JAR" "output/${VERSION}.jar"
          echo "成功生成 output/${VERSION}.jar"

      - name: Save build result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.recognized == 'true' && steps.version.outputs.name || '无法识别' }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
