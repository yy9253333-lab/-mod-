name: Qiyuan Auto Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 查找修复版源码 ZIP
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname 'qiyuan-r6-A-anchored-array-source-fixed.zip' \
            ! -path '*/_extracted/*' \
            -print -quit)"

          if [ -z "$SOURCE_ZIP" ]; then
            echo "::error::没有找到修复版 ZIP，请确认文件已上传到仓库。"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 -type f -iname '*.zip'
            exit 1
          fi

          echo "选中的源码包：$SOURCE_ZIP"

          DEST="$GITHUB_WORKSPACE/_extracted/fixed-source"
          mkdir -p "$DEST"
          unzip -oq "$SOURCE_ZIP" -d "$DEST"

          BUILD_FILE="$(find "$DEST" \
            -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::修复版 ZIP 内没有找到 Gradle 构建文件。"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "最终编译目录：$PROJECT_DIR"

          echo "检查修复内容："
          grep -n 'getPlayers(p -> true)' \
            "$PROJECT_DIR/src/main/java/cn/blockforge/generated/modb22b5730/block/entity/InscribedRuneBlockEntity.java"

          grep -n 'ENCHANTMENT_TABLE_USE' \
            "$PROJECT_DIR/src/main/java/cn/blockforge/generated/modb22b5730/block/ResonanceTableBlock.java"

          grep -n 'serverLevel.sendParticles' \
            "$PROJECT_DIR/src/main/java/cn/blockforge/generated/modb22b5730/block/ResonanceTableBlock.java"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: 编译模组
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ls -la

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon build
          else
            gradle --no-daemon build
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Qiyuan-Forge-1.20.1
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
            !**/build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14
