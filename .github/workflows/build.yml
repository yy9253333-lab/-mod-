name: Qiyuan Auto Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 查找并解压源码
        shell: bash
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/_extracted"

          find "$GITHUB_WORKSPACE" \
            -type f -iname '*.zip' \
            ! -path '*/_extracted/*' \
            -print0 |
          while IFS= read -r -d '' zipfile; do
            echo "正在解压：$zipfile"
            dest="$GITHUB_WORKSPACE/_extracted/$(basename "$zipfile" .zip)"
            mkdir -p "$dest"
            unzip -oq "$zipfile" -d "$dest"
          done

          echo "正在查找 build.gradle..."
          BUILD_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \( -name build.gradle -o -name build.gradle.kts \) \
            ! -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "仓库文件列表："
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | head -200
            echo "::error::仍未找到 build.gradle，请检查 ZIP 是否已上传到仓库。"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "找到项目：$PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: 编译模组
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ls -la

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon build
          else
            gradle --no-daemon build
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Qiyuan-Forge-1.20.1
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
            !**/build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14
